<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width" />
    <link rel="icon" href="favicon.png" type="image/x-icon" />
    <title>Ran-gi</title>
    <style>
        html {
            font-family: Georgia, 'Times New Roman', Times, serif;

        main {

        }

        main>* {
            margin: 0 auto;

            padding:10px 20px;
        }

<body>
    <main>
